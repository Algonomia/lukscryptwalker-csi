image:
  repository: ghcr.io/algonomia/lukscryptwalker-csi
  tag: "v1.4.0"
  pullPolicy: IfNotPresent

# Image pull secrets
imagePullSecrets: []

# CSI Driver configuration
csiDriver:
  name: lukscryptwalker.csi.k8s.io
  attachRequired: false
  podInfoOnMount: true  # Enable to get pod fsGroup information

# Controller configuration
controller:
  # 2 replicas + sidecar leader election give failover during crashes and upgrades.
  # A PodDisruptionBudget (minAvailable: 1) is created whenever replicas > 1.
  replicas: 2

  # Requires the chart to be installed in kube-system; use a custom
  # PriorityClass name otherwise.
  priorityClassName: system-cluster-critical

  # Sidecar images
  sidecars:
    provisioner:
      image:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v3.6.2
        pullPolicy: IfNotPresent
    resizer:
      image:
        repository: registry.k8s.io/sig-storage/csi-resizer
        tag: v1.9.2
        pullPolicy: IfNotPresent
    livenessProbe:
      image:
        repository: registry.k8s.io/sig-storage/livenessprobe
        tag: v2.15.0
        pullPolicy: IfNotPresent
      # Port the sidecar serves /healthz on (pod-local network)
      healthPort: 9808

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Node configuration
node:
  # Kubelet root AS RESOLVED ON THE HOST (follow symlinks). The driver derives
  # FUSE mount paths from this, and librclone mounts inside the container, so
  # the container must expose this exact path with Bidirectional propagation —
  # otherwise its mounts never reach the host and consumers silently bind the
  # unencrypted directory underneath.
  #   default:  /var/lib/kubelet
  #   microk8s: /var/snap/microk8s/common/var/lib/kubelet
  #   k0s:      /var/lib/k0s/kubelet
  # Check with: readlink -f /var/lib/kubelet
  kubeletDir: /var/lib/kubelet

  # VFS cache configuration
  vfsCacheSize: "20G"  # Size of the encrypted LUKS volume for VFS cache

  # Take file mtimes from the S3 listing instead of each object's metadata.
  # Metadata is not returned by a listing, so reading it costs one HEAD per
  # file: a cold `ls` of a large directory becomes thousands of round-trips.
  # Cost of leaving this on: mtime is the S3 upload time rather than the exact
  # write time (rclone still stores the true mtime, so this is reversible).
  useServerModTime: true

  # Upgrade one node at a time: the driver serves FUSE mounts in-process, so
  # restarting it disrupts every volume on the node.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  # Requires the chart to be installed in kube-system; use a custom
  # PriorityClass name otherwise.
  priorityClassName: system-node-critical

  # HOST ports (hostNetwork pod): these three share the node's port space and
  # MUST be distinct — the chart refuses to render otherwise. The driver's
  # registration-health endpoint, also passed to it via
  # --registration-health-endpoint so probe and driver cannot drift apart.
  registrationHealthPort: 9810

  # Sidecar images
  sidecars:
    nodeDriverRegistrar:
      image:
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.13.0
        pullPolicy: IfNotPresent
      # Port the registrar serves its own /healthz on.
      healthPort: 9809
    livenessProbe:
      image:
        repository: registry.k8s.io/sig-storage/livenessprobe
        tag: v2.15.0
        pullPolicy: IfNotPresent
      # Port the livenessprobe sidecar serves /healthz on (the driver's own
      # startup and liveness probes target it).
      healthPort: 9811

  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}

# Storage configuration
storage:
  # Default local path for volumes (overrides hardcoded fallback)
  defaultPath: "/opt/local-path-provisioner"
  
  # Default size for backing files
  defaultSize: "1Gi"

# LUKS secret configuration (shared by all StorageClasses by default)
# WARNING: Setting passphrase in values.yaml is not secure for production!
# For production, create secrets manually and set create: false
secret:
  name: luks-secret
  namespace: kube-system
  # Auto-create secret with random passphrase
  create: true  # Set to false for production and create secret manually
  # If create is false, provide your own passphrase
  passphrase: ""  # WARNING: Not secure - use external secret management
  # Key name within the secret that contains the passphrase
  passphraseKey: "passphrase"

# StorageClasses configuration - all StorageClasses are defined here
storageClasses:
  # Default StorageClass with automatic fsGroup detection
  - name: lukscryptwalker-local
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    # fsGroup: null  # Auto-detect from pod (default behavior)
    # fsMode: "0750"  # Recursive mode applied with fsGroup (default 0750).
    #                 # Set "0770" only if a non-owner container must group-write.
    secret:
      name: luks-secret
      namespace: kube-system
      passphraseKey: "passphrase"

  # Example: pin fsGroup instead of auto-detecting it from the pod.
  # Uncomment and customize as needed

  # - name: lukscryptwalker-custom
  #   isDefault: false
  #   reclaimPolicy: Delete
  #   allowVolumeExpansion: true
  #   volumeBindingMode: WaitForFirstConsumer
  #   fsGroup: 1001  # Custom application group
  #   secret:
  #     name: custom-luks-secret
  #     namespace: kube-system
  #     passphraseKey: "encryption-key"

# RBAC configuration
rbac:
  create: true

# ServiceAccount configuration  
serviceAccount:
  controller:
    create: true
    name: lukscryptwalker-csi-controller
    annotations: {}
  node:
    create: true
    name: lukscryptwalker-csi-node
    annotations: {}

# Security context
securityContext:
  # Controller runs as non-privileged
  controller:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
  # Node must run privileged for LUKS operations
  node:
    privileged: true
    runAsUser: 0
    runAsGroup: 0
    allowPrivilegeEscalation: true
    capabilities:
      add: ["SYS_ADMIN"]

# Pod security context (for pod-level settings like fsGroup)
podSecurityContext:
  controller: {}  # No fsGroup needed - directories are created with 0777 permissions
  node: {}

# Logging
logging:
  level: 4

# Node selector for deployment
nodeSelector: {}

# Tolerations
tolerations: []

# Pod annotations
podAnnotations: {}

# S3 Storage Classes configuration - rclone mount with encrypted S3 backend
s3StorageClasses:
  # Example S3 StorageClass with rclone mount
  - name: lukscryptwalker-s3
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    fsType: "ext4"
    # fsGroup: null  # Auto-detect from pod

    # Encryption passphrase (rclone crypt uses NaCl SecretBox)
    secret:
      name: luks-secret
      namespace: kube-system
      passphraseKey: "passphrase"

    # S3 Configuration - all parameters stored in a single secret
    # WARNING: Setting credentials in values.yaml is not secure for production!
    # For production, create secrets manually and set create: false
    s3:
      # pathPrefix: "my-app/data"  # Optional: custom path in S3 (default: volumes/{volumeID}/files)
                                   # When set, this is also used as salt for encryption password2
                                   # Note: This is a StorageClass parameter, not stored in the secret
      secret:
        name: s3-credentials
        namespace: kube-system
        create: true  # Set to false for production and create secret manually
        # S3 bucket configuration
        bucket: "my-encrypted-volumes"
        region: "us-east-1"
        # endpoint: "https://s3.amazonaws.com"  # Optional: for S3-compatible services
        # forcePathStyle: false  # Set to true for MinIO and similar services
        # S3 credentials
        accessKeyId: ""  # WARNING: Not secure - use external secret management
        secretAccessKey: ""  # WARNING: Not secure - use external secret management

    # VFS Cache Configuration (rclone mount caches files locally in LUKS container)
    vfsCache:
      mode: "full"  # Options: off, minimal, writes, full
      maxAge: "1h"  # Max time to keep file in cache
      maxSize: "1G"  # Max total size of cache
      pollInterval: "1m"  # How often rclone checks for stale cache entries
      writeBack: "5s"  # Time to wait before uploading modified files
      # Directory-metadata caching. Raise these for metadata-heavy workloads on
      # large directories so stat/readdir/exists
      # checks don't trigger an S3 ListObjects + filename decryption every time.
      # Safe to set high for these RWO/single-writer volumes.
      # dirCacheTime: "1h"   # default: 1h
      # attrTimeout: "1h"    # default: 1h

  # Example S3 StorageClass with minimal caching (saves local space)
  # - name: lukscryptwalker-s3-minimal
  #   isDefault: false
  #   reclaimPolicy: Delete
  #   allowVolumeExpansion: true
  #   volumeBindingMode: WaitForFirstConsumer
  #   fsType: "ext4"
  #
  #   secret:
  #     name: luks-secret
  #     namespace: kube-system
  #     passphraseKey: "passphrase"
  #
  #   s3:
  #     # pathPrefix: "backup/data"  # Optional: custom path in S3
  #     secret:
  #       name: s3-backup-credentials
  #       namespace: kube-system
  #       create: true  # WARNING: Not secure for production
  #       bucket: "my-backup-volumes"
  #       region: "us-west-2"
  #       accessKeyId: ""
  #       secretAccessKey: ""
  #
  #   vfsCache:
  #     mode: "minimal"  # Only cache open files
  #     maxAge: "30m"
  #     maxSize: "500M"

  # Example S3 StorageClass for OVH S3 with custom path
  # - name: lukscryptwalker-ovh
  #   isDefault: false
  #   reclaimPolicy: Delete
  #   allowVolumeExpansion: true
  #   volumeBindingMode: WaitForFirstConsumer
  #
  #   secret:
  #     name: luks-secret
  #     namespace: kube-system
  #     passphraseKey: "passphrase"
  #
  #   s3:
  #     pathPrefix: "my-app/data"  # Custom path - also used as encryption salt
  #     secret:
  #       name: ovh-s3-credentials
  #       namespace: kube-system
  #       create: true  # WARNING: Not secure for production
  #       bucket: "encrypted-volumes"
  #       region: "gra"  # GRA, SBG, DE, UK, etc.
  #       endpoint: "https://s3.gra.cloud.ovh.net"
  #       forcePathStyle: false
  #       accessKeyId: ""
  #       secretAccessKey: ""
  #
  #   vfsCache:
  #     mode: "full"
  #     maxAge: "2h"
  #     maxSize: "2G"
  #     writeBack: "10s"
