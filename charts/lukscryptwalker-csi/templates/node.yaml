{{/*
The node pod is hostNetwork: all three listeners share one port space. A
collision only shows up in the field as "address already in use" plus a
container kubelet kills forever on a probe that can never succeed — so refuse
to render instead.
*/}}
{{/* Compared as strings: --set yields int64 where values.yaml yields int, and
     uniq is type-sensitive, so a real collision would slip through untyped. */}}
{{- $ports := list (toString .Values.node.registrationHealthPort) (toString .Values.node.sidecars.nodeDriverRegistrar.healthPort) (toString .Values.node.sidecars.livenessProbe.healthPort) -}}
{{- if ne (len $ports) (len (uniq $ports)) -}}
{{- fail (printf "node host ports must be distinct (hostNetwork pod), got registrationHealthPort=%v nodeDriverRegistrar.healthPort=%v livenessProbe.healthPort=%v" .Values.node.registrationHealthPort .Values.node.sidecars.nodeDriverRegistrar.healthPort .Values.node.sidecars.livenessProbe.healthPort) -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lukscryptwalker-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lukscryptwalker-csi.node.labels" . | nindent 4 }}
spec:
  {{- with .Values.node.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lukscryptwalker-csi.node.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lukscryptwalker-csi.node.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "lukscryptwalker-csi.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "lukscryptwalker-csi.node.serviceAccountName" . }}
      {{- with .Values.node.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      hostNetwork: true
      hostPID: true
      {{- with .Values.podSecurityContext.node }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: node-driver-registrar
        image: {{ .Values.node.sidecars.nodeDriverRegistrar.image.repository }}:{{ .Values.node.sidecars.nodeDriverRegistrar.image.tag }}
        imagePullPolicy: {{ .Values.node.sidecars.nodeDriverRegistrar.image.pullPolicy }}
        args:
        - "--v={{ .Values.logging.level }}"
        - "--csi-address=$(ADDRESS)"
        - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
        # Loopback only: with hostNetwork this would otherwise listen on the
        # node's (possibly public) IP.
        - "--http-endpoint=127.0.0.1:{{ .Values.node.sidecars.nodeDriverRegistrar.healthPort }}"
        env:
        - name: ADDRESS
          value: /csi/csi.sock
        - name: DRIVER_REG_SOCK_PATH
          value: /var/lib/kubelet/plugins/{{ .Values.csiDriver.name }}/csi.sock
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        livenessProbe:
          # The driver's registration-health endpoint: a lost registration
          # restarts only this registrar, not the driver or its mounts.
          # host 127.0.0.1: with hostNetwork the default probe target is the
          # node's (possibly public, firewalled) IP.
          #
          # KNOWN RISK: this ties the registrar's life to a port the driver
          # owns. If the port is held by anything else (an orphaned listener
          # from a dead driver, or another container configured on it — the pod
          # is hostNetwork, so the whole node shares one port space), the probe
          # can never succeed and kubelet kills a registrar that is registering
          # fine, clearing CSINode and stopping volume operations. The driver
          # escalates that case as a RegistrationHealthPortUnavailable Node
          # event naming the process holding the port; alert on it. To break the
          # loop by hand, remove this probe (kubectl patch ds ... remove
          # /containers/0/livenessProbe).
          # Both this probe and the driver's --registration-health-endpoint come
          # from one value, so they cannot drift apart.
          # Generous threshold so a throttled driver doesn't flap the
          # registrar into a deregistration loop.
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: {{ .Values.node.registrationHealthPort }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi/
        - name: registration-dir
          mountPath: /registration/
      - name: liveness-probe
        image: {{ .Values.node.sidecars.livenessProbe.image.repository }}:{{ .Values.node.sidecars.livenessProbe.image.tag }}
        imagePullPolicy: {{ .Values.node.sidecars.livenessProbe.image.pullPolicy }}
        args:
        - "--csi-address=/csi/csi.sock"
        # Loopback only: with hostNetwork this would otherwise listen on the
        # node's (possibly public) IP.
        - "--http-endpoint=127.0.0.1:{{ .Values.node.sidecars.livenessProbe.healthPort }}"
        # Tolerate a CPU-throttled driver during backup windows: crypt+upload
        # runs in-process, and a killed driver takes every FUSE mount with it.
        - "--probe-timeout=10s"
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi/
      - name: lukscryptwalker-csi
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext.node }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        args:
        - "--endpoint=$(CSI_ENDPOINT)"
        - "--nodeid=$(KUBE_NODE_NAME)"
        - "--vfs-cache-size={{ .Values.node.vfsCacheSize }}"
        - "--luks-secret-name={{ .Values.secret.name }}"
        - "--luks-secret-namespace={{ .Values.secret.namespace }}"
        - "--luks-secret-key={{ .Values.secret.passphraseKey }}"
        # Same value as the registrar's livenessProbe port above.
        - "--registration-health-endpoint=127.0.0.1:{{ .Values.node.registrationHealthPort }}"
        env:
        - name: CSI_ENDPOINT
          value: unix:///csi/csi.sock
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CSI_LOCAL_PATH
          value: {{ .Values.storage.defaultPath | quote }}
        # Host self-heal watchdog v2 (systemd timer installed by the driver):
        # container-scoped ONLY — on the shim-zombie signature (runtime claims
        # Running, no driver process, 10min) it stops our own dead sandbox so
        # kubelet recreates it. Never touches runtime, control plane, or node.
        - name: HOST_WATCHDOG
          value: {{ .Values.node.hostWatchdog | default true | quote }}
        # S3 keeps rclone's mtime in object metadata, which listings don't
        # return — so reading it costs one HEAD per file and a cold `ls` of a
        # large directory becomes thousands of round-trips. Serve mtimes from
        # the listing instead. Set "false" to get exact mtimes back at that cost.
        - name: RCLONE_USE_SERVER_MODTIME
          value: {{ .Values.node.useServerModTime | default true | quote }}
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi
        - name: pods-mount-dir
          mountPath: /var/lib/kubelet
          mountPropagation: "Bidirectional"
{{- if ne (.Values.node.kubeletDir | default "/var/lib/kubelet") "/var/lib/kubelet" }}
        # The driver builds FUSE mount paths from the kubelet root RESOLVED ON
        # THE HOST (microk8s: /var/lib/kubelet -> /var/snap/microk8s/...), and
        # librclone mounts in-container. Without this second mount at the
        # resolved path, those mounts land in the container's own filesystem:
        # invisible to the host, so consumers bind the bare directory
        # underneath and write unencrypted data to the node disk.
        - name: pods-mount-dir
          mountPath: {{ .Values.node.kubeletDir }}
          mountPropagation: "Bidirectional"
{{- end }}
        - name: device-dir
          mountPath: /dev
        - name: local-path-dir
          mountPath: {{ .Values.storage.defaultPath }}
          mountPropagation: "Bidirectional"
        - name: cache-dir
          mountPath: /var/lib/lukscrypt-cache
          mountPropagation: "Bidirectional"
        - name: vfs-cache-dir
          mountPath: /var/lib/lukscrypt-vfs-cache
          mountPropagation: "Bidirectional"
        # No ports: block — with hostNetwork, declared containerPorts become
        # hostPort claims, and a zombie predecessor's claim blocks replacement
        # pods from being admitted (observed: Pending forever behind a wedged
        # shim). Probes target the numeric port directly.
        # Both probes go through the livenessprobe sidecar, which calls the
        # CSI Probe() RPC — verifying the gRPC server responds, not just that
        # the socket file exists.
        # Startup does an API secret fetch, stale loop/LUKS cleanup, cryptsetup
        # open (memory-hard KDF) and ext4 mount — slower after unclean kills.
        # 60s grace caused kill-during-startup restart loops; allow 120s.
        # host 127.0.0.1 on both probes: with hostNetwork the default probe
        # target is the node's (possibly public, firewalled) IP.
        startupProbe:
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: {{ .Values.node.sidecars.livenessProbe.healthPort }}
          failureThreshold: 60
          periodSeconds: 2
        # Liveness-killing this container tears down every FUSE mount on the
        # node; tolerate throttled-but-alive (backup windows), catch truly hung.
        livenessProbe:
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: {{ .Values.node.sidecars.livenessProbe.healthPort }}
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        {{- with .Values.node.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: plugin-dir
        hostPath:
          path: /var/lib/kubelet/plugins/{{ .Values.csiDriver.name }}
          type: DirectoryOrCreate
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry/
          type: Directory
      - name: pods-mount-dir
        hostPath:
          path: /var/lib/kubelet
          type: Directory
      - name: device-dir
        hostPath:
          path: /dev
      - name: local-path-dir
        hostPath:
          path: {{ .Values.storage.defaultPath }}
          type: DirectoryOrCreate
      - name: cache-dir
        hostPath:
          path: /var/lib/lukscrypt-cache
          type: DirectoryOrCreate
      - name: vfs-cache-dir
        hostPath:
          path: /var/lib/lukscrypt-vfs-cache
          type: DirectoryOrCreate
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}